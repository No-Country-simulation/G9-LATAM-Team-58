spring.application.name=techapi

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.oracle.sql-migration-suffix=.sql

# Inference service. The default targets a locally running service; compose sets
# INFERENCE_BASE_URL=http://inference:8000 (relaxed binding) so the containers
# talk over the internal network. Never default this to the VM's public IP --
# port 8000 is closed there, and shipping an origin IP in the repo undoes the
# point of putting Cloudflare in front.
inference.base-url=http://localhost:8000
inference.connect-timeout=5s
inference.read-timeout=30s

# File uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Scaffold mode by default (override with profile 'db' for real database)
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
