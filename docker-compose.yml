# TechMind runtime: api + inference on the Ampere A1 VM.
#
# There is NO database container -- persistence is the managed Autonomous
# Database. The web front is served by nginx here on the VM, not a bucket:
# OCI Object Storage can't host a SPA.

services:
  inference:
    build:
      context: ./inference
    image: techmind-inference:local
    restart: unless-stopped
    # Deliberately NOT published to the host. Only the api calls it, over the
    # internal compose network. Section 3 of the runbook keeps 8000 closed.
    expose:
      - "8000"
    environment:
      # Filled in once the service downloads the artifact at startup.
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      MODEL_BUCKET: ${MODEL_BUCKET:-techmind-data}
    networks: [techmind]

  api:
    build:
      context: ./api
    image: techmind-api:local
    restart: unless-stopped
    # Not published: everything reaches the API through nginx (/api proxy) now
    # that mindloom.lat is live. Port 8080 is closed in the Security List too --
    # an open 8080 would bypass Cloudflare and expose the origin IP.
    expose:
      - "8080"
    environment:
      # 'db' profile turns on the DB-backed beans (app.database.enabled=true) --
      # without it the app runs in scaffold mode and every DB-backed endpoint
      # returns 503. Relaxed binding: SPRING_DATASOURCE_URL -> spring.datasource.url,
      # and INFERENCE_BASE_URL -> inference.base-url.
      SPRING_PROFILES_ACTIVE: db
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      INFERENCE_BASE_URL: http://inference:8000
      TNS_ADMIN: /app/wallet
    volumes:
      # Unzipped Instance Wallet. Lives on the VM, never in the repo.
      - ./wallet:/app/wallet:ro
    depends_on:
      inference:
        condition: service_healthy
    # /health never fails, so a 200 here means "accepting traffic", not "healthy
    # in every dependency". start_period covers Spring's boot time.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [techmind]

  # nginx serves the React build and reverse-proxies /api to the api container.
  # OCI Object Storage cannot host a SPA (no index fallback, 404 on refresh), so
  # the front lives here instead of a bucket.
  #
  # Behind `profiles: [web]` so a plain `docker compose build/up` (local api+inference
  # dev, no front) stays unaffected; deploy.yml passes `--profile web` to include it.
  web:
    build:
      context: ./web
    image: techmind-web:local
    restart: unless-stopped
    profiles: [web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Cloudflare Origin Certificate, generated once in the dashboard and left
      # on the VM. Never in the repo -- the .key is a private key. Expected file
      # names: mindloom.pem and mindloom.key (nginx.conf points at them).
      - ./certs:/etc/nginx/certs:ro
    # Deliberately not gated on the api being healthy: nginx also serves the
    # static SPA, and waiting would take the whole site down whenever the API is.
    depends_on:
      - api
    networks: [techmind]

networks:
  techmind:
    driver: bridge
