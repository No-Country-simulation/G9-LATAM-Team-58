name: Deploy

# Builds ON the VM over SSH, not on the runner: the VM is Ampere A1 (arm64) and
# GitHub runners are x86. Cross-building with buildx + QEMU works but takes
# 20-40 min once the transformer is baked in.
#
# A single job: api + inference + web build on the VM via docker compose. The web
# front (nginx) sits behind `profiles: [web]` in docker-compose.yml; the build/up
# commands below pass `--profile web` to bring it in.
#
# The front is NOT uploaded to a bucket -- OCI Object Storage can't host a SPA,
# so nginx will serve it from the VM. No OCI_CLI_* secrets needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: api + inference + web -> Ampere VM
    runs-on: ubuntu-latest
    steps:
      - name: Build and restart on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # No script_stop input in ssh-action@v1; `set -e` below does the job.
          script: |
            set -euo pipefail
            cd ~/techmind
            git fetch origin main
            git reset --hard origin/main
            docker compose --profile web build
            docker compose --profile web up -d --remove-orphans
            docker image prune -f
            docker compose ps

            # Smoke test: without it the job goes green whenever the containers
            # merely started, even if the API is failing every request. Give it
            # room -- inference downloads the artifact from the bucket and warms
            # the transformer before it answers.
            echo "Esperando a que la API responda..."
            for attempt in $(seq 1 30); do
              # Probed from inside the container on purpose: 8080 is not
              # published to the host, so the VM cannot curl it directly.
              if docker compose exec -T api curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
                echo "API arriba tras ${attempt} intento(s)."
                exit 0
              fi
              sleep 10
            done

            echo "La API no respondió en 5 minutos. Últimos logs:"
            docker compose logs --tail 50 api inference
            exit 1
