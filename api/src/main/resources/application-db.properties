# Database profile for Oracle ATP with wallet. This file is committed to the
# repo -- never hardcode real credentials here. Each placeholder below must be
# set as an env var (SPRING_DATASOURCE_URL/USERNAME/PASSWORD) before running
# with this profile; with none set, startup fails fast instead of running
# with a broken datasource. See docker-compose.yml (VM) or export them
# locally -- same three vars either way.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Enable database-dependent beans
app.database.enabled=true

# Remove scaffolding exclusions (we want real DB)
spring.autoconfigure.exclude=
