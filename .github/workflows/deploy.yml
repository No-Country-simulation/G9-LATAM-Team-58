name: Deploy

# Builds ON the VM over SSH, not on the runner: the VM is Ampere A1 (arm64) and
# GitHub runners are x86. Cross-building with buildx + QEMU works but takes
# 20-40 min once the transformer is baked in.
#
# A single job: api + inference + web build on the VM via docker compose. The web
# front (nginx) sits behind `profiles: [web]` in docker-compose.yml; the build/up
# commands below pass `--profile web` to bring it in.
#
# The front is NOT uploaded to a bucket -- OCI Object Storage can't host a SPA,
# so nginx will serve it from the VM. No OCI_CLI_* secrets needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    name: api + inference + web -> Ampere VM
    runs-on: ubuntu-latest
    steps:
      - name: Build and restart on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # No script_stop input in ssh-action@v1; `set -e` below does the job.
          script: |
            set -euo pipefail
            cd ~/techmind
            git fetch origin main
            git reset --hard origin/main
            docker compose --profile web build
            docker compose --profile web up -d --remove-orphans
            docker image prune -f
            docker compose ps
